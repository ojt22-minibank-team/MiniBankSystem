spring.application.name=corebanking
spring.main.allow-bean-definition-overriding=true

# =========================================================
# Database Connection Settings
spring.datasource.url=jdbc:mysql://42.156.32.114:4405/cbd
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA/Hibernate Settings
# =========================================================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================
# Data Seeding (Unified Master Seeder: 3,000 Customers, 10,000 Transactions, Full System Data)
# =========================================================
app.seed.enabled=false
app.seed.sample-data.enabled=false
app.seed.demo-data.enabled=false

# =========================================================
# Security & Authentication Configurations
# =========================================================
security.auth.max-failed-attempts=5
security.auth.lockout-duration-minutes=15
security.auth.refresh-token-validity-days=1

# Staff Password Setup
app.security.password-setup.expiration-minutes=30

# =========================================================
# JWT Configuration
# =========================================================
# Customer Portal JWT keys
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.issuer=corebanking

# (Alternative JWT properties from second code - uncomment if needed by your config class)
 application.security.jwt.secret-key=${APP_JWT_SECRET}
 application.security.jwt.expiration=900000
 application.security.jwt.issuer=CoreBankingSystem

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =========================================================
# Jasper Reports
# =========================================================
jasper.report.path=classpath:reports/

# =========================================================
# Frontend setup URL
# =========================================================
app.frontend.base-url=http://localhost:5173

# =========================================================
# Email SMTP Configuration
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# (2) Alternative Email (from file 1 - Commented out)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================
# Group 3 Payment Gateway Integration
# =========================================================
group3.gateway.base-url=http://localhost:8004
group3.gateway.internal-key=${GATEWAY_INTERNAL_KEY}

# =========================================================
# Network & Response Compression
# =========================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024